<div class="stack">
  <div>
    <h1>Games</h1>
    <p class="subtitle">Challenges that get people outside together.</p>
  </div>

  @if (isAdministrator()) {
    <section class="stack">
      <h2 class="section-label">Administration</h2>

      <div class="grid">
        <a class="card card--interactive tile" routerLink="/games/social-challenges">
          <span class="icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="8" cy="8" r="3" />
              <circle cx="16" cy="8" r="3" />
              <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
              <path d="M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
            </svg>
          </span>
          <span>
            <span class="tile-title">Social challenges</span>
            <span class="tile-description">
              Create, publish and retire challenges where people meet at the same place and time.
            </span>
          </span>
        </a>
      </div>
    </section>
  }

  <p><a routerLink="/examples/map-pins">Probni primer mape — pinovi</a></p>
</div>
