<div class="games games--narrow">
  <a class="back" routerLink="/games/quizzes">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
    Quizzes
  </a>

  <div class="page-header">
    <div>
      <h1>Create quiz</h1>
      <p>Save it as a draft now and finish the questions later.</p>
    </div>
  </div>

  <app-quiz-form
    [fields]="fields"
    [pending]="pending()"
    [error]="error()"
    saveLabel="Save draft"
    note="New quizzes start as drafts."
    cancelLink="/games/quizzes"
    (save)="create($event)"
    (dismissed)="error.set(null)"
  />
</div>
