@if (confirming()) {
  <div class="confirm">
    <span class="confirm__text">Are you sure you want to delete the quiz?</span>
    <button
      type="button"
      class="button"
      [class.button--small]="small()"
      [disabled]="pending()"
      (click)="confirmingChange.emit(false)"
    >
      Cancel
    </button>
    <button
      type="button"
      class="button button--danger-solid"
      [class.button--small]="small()"
      [disabled]="pending()"
      (click)="requested.emit('delete')"
    >
      Delete
    </button>
  </div>
} @else {
  <div class="row-actions">
    @switch (status()) {
      @case ('Draft') {
        @if (withEdit()) {
          <button type="button" class="button" [disabled]="pending()" (click)="edit.emit()">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>
            Edit
          </button>
        }
        <button
          type="button"
          class="button button--primary"
          [class.button--small]="small()"
          [disabled]="pending()"
          (click)="requested.emit('publish')"
        >
          Publish
        </button>
      }
      @case ('Published') {
        <button type="button" class="button" [class.button--small]="small()" [disabled]="pending()" (click)="requested.emit('retire')">
          Retire
        </button>
      }
      @case ('Retired') {
        <button type="button" class="button" [class.button--small]="small()" [disabled]="pending()" (click)="requested.emit('archive')">
          Archive
        </button>
      }
    }
    @if (status() === 'Draft' || status() === 'Archived') {
      <button
        type="button"
        class="button button--danger"
        [class.button--small]="small()"
        [disabled]="pending()"
        (click)="confirmingChange.emit(true)"
      >
        @if (withEdit()) {
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" /></svg>
        }
        Delete
      </button>
    }
  </div>
}
