@if (confirming()) {
  <div class="confirm">
    <span class="confirm__text">Are you sure you want to delete the quiz?</span>
    <button
      type="button"
      class="button"
      [class.button--small]="small()"
      [disabled]="pending()"
      (click)="confirmingChange.emit(false)"
    >
      Cancel
    </button>
    <button
      type="button"
      class="button button--danger-solid"
      [class.button--small]="small()"
      [disabled]="pending()"
      (click)="requested.emit('delete')"
    >
      Delete
    </button>
  </div>
} @else {
  <div class="form-actions">
    @switch (status()) {
      @case ('Draft') {
        @if (withEdit()) {
          <button type="button" class="button" [class.button--small]="small()" [disabled]="pending()" (click)="edit.emit()">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z" /></svg>
            <span>Edit</span>
          </button>
        }
        <button
          type="button"
          class="button button--primary"
          [class.button--small]="small()"
          [disabled]="pending()"
          (click)="requested.emit('publish')"
        >
          Publish
        </button>
      }
      @case ('Published') {
        <button type="button" class="button" [class.button--small]="small()" [disabled]="pending()" (click)="requested.emit('retire')">
          Retire
        </button>
      }
      @case ('Retired') {
        <button type="button" class="button" [class.button--small]="small()" [disabled]="pending()" (click)="requested.emit('archive')">
          Archive
        </button>
      }
    }
    @if (status() === 'Draft' || status() === 'Archived') {
      <button
        type="button"
        class="button button--danger"
        [class.button--small]="small()"
        [disabled]="pending()"
        (click)="confirmingChange.emit(true)"
      >
        @if (withEdit()) {
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></svg>
        }
        <span>Delete</span>
      </button>
    }
  </div>
}
