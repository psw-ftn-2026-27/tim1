<div class="search">
  <div class="field">
    <label for="title-search">Search by title (press Enter)</label>
    <input
      id="title-search"
      type="search"
      [formField]="form.title"
      (keydown.enter)="applyTitle()"
    />
  </div>

  <div class="field">
    <label for="tag-input">Tags (press Enter to add)</label>
    <div class="tag-box">
      @for (tag of criteria().tags; track tag) {
        <span class="pill">
          {{ tag }}
          <button
            type="button"
            class="pill-remove"
            [attr.aria-label]="'Remove tag ' + tag"
            (click)="removeTag(tag)"
          >
            &#10005;
          </button>
        </span>
      }
      <input id="tag-input" type="text" [formField]="form.tagInput" (keydown.enter)="addTag()" />
    </div>
  </div>

  <div class="field">
    <label for="sort">Sort</label>
    <select id="sort" (change)="changeSort($event)">
      <option value="Newest" [selected]="criteria().sort === 'Newest'">Newest first</option>
      @if (criteria().difficulties.length !== 1) {
        <option value="DifficultyAscending" [selected]="criteria().sort === 'DifficultyAscending'">
          Difficulty: easy to hard
        </option>
        <option
          value="DifficultyDescending"
          [selected]="criteria().sort === 'DifficultyDescending'"
        >
          Difficulty: hard to easy
        </option>
      }
    </select>
  </div>

  <div class="field">
    <span class="label">Transport</span>
    <div class="options">
      <button
        type="button"
        class="option"
        [class.option--active]="criteria().transports.length === 0"
        (click)="clearTransports()"
      >
        All
      </button>
      @for (transport of transports; track transport) {
        <button
          type="button"
          class="option"
          [class.option--active]="criteria().transports.includes(transport)"
          (click)="toggleTransport(transport)"
        >
          {{ transport }}
        </button>
      }
    </div>
  </div>

  <div class="field">
    <span class="label">Difficulty</span>
    <div class="options">
      <button
        type="button"
        class="option"
        [class.option--active]="criteria().difficulties.length === 0"
        (click)="clearDifficulties()"
      >
        All
      </button>
      @for (difficulty of difficulties; track difficulty) {
        <button
          type="button"
          class="option"
          [class.option--active]="criteria().difficulties.includes(difficulty)"
          (click)="toggleDifficulty(difficulty)"
        >
          {{ difficulty }}
        </button>
      }
    </div>
  </div>

  <button type="button" class="button" (click)="clearFilters()">Clear filters</button>
</div>
