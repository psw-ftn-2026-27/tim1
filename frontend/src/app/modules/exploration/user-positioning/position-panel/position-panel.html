<aside class="stack card" aria-label="Simulator pozicije">
  <h2>Simulator pozicije</h2>
  <p>Klikni na mapu da postaviš svoju trenutnu poziciju.</p>
  <app-map [pins]="pins()" [selectionEnabled]="!busy()" [showSelectionPin]="false"
    (locationSelected)="selected.emit($event)" />
  <p role="status">{{ message() }}</p>
  @if (readFailed()) {
    <button class="button" type="button" (click)="retry.emit()">Ponovo učitaj poziciju</button>
  }
  <button class="button" type="button" (click)="closed.emit()">Zatvori</button>
</aside>
