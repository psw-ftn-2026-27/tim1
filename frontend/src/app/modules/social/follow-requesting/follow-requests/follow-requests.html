<div class="stack">
  <div class="header">
    <a class="back" routerLink="/social" aria-label="Back">←</a>
    <h1>Requests</h1>
    <a class="add" routerLink="/social/people" aria-label="Send a new request">+</a>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (requests.isLoading()) {
    <p>Loading requests...</p>
  } @else if (requests.error()) {
    <p class="error">Requests could not be loaded. Log in and try again.</p>
  } @else {
    <div class="stack">
      @for (request of requests.value() ?? []; track request.id) {
        <app-follow-request-card
          [request]="request"
          [disabled]="pending()"
          (deleteClicked)="delete($event)"
        />
      } @empty {
        <p>No sent requests.</p>
      }
    </div>
  }
</div>
