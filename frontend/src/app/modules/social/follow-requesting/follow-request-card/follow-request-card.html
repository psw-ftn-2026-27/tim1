<article class="card row">
  <h3>{{ request().recipientDisplayName }}</h3>

  <span
    class="badge status"
    [class.badge--warning]="request().status === 'Pending'"
    [class.badge--danger]="request().status === 'Rejected'"
  >
    @switch (request().status) {
      @case ('Pending') {
        Na čekanju
      }
      @case ('Accepted') {
        Pratiš
      }
      @case ('Rejected') {
        Odbijeno
      }
    }
  </span>
</article>

<span class="slot">
  @if (request().status === 'Pending') {
    <button
      class="button"
      type="button"
      aria-label="Obriši zahtev"
      [disabled]="disabled()"
      (click)="deleteClicked.emit(request().id)"
    >
      ✗
    </button>
  }
</span>
