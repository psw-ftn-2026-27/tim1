<article class="card stack">
  <h3>{{ blog().title }}</h3>

  <app-blog-description [markdown]="blog().description" />

  @if (blog().images.length > 0) {
    <div class="images">
      @for (imageId of blog().images; track imageId) {
        <app-protected-image [src]="'/api/social/blogs/' + blog().id + '/images/' + imageId" />
      }
    </div>
  }

  <p class="meta">Status: {{ blog().status }}</p>

  <p class="meta">Comments: {{ blog().comments.length }}</p>

  <a [routerLink]="['/social', blog().id]">Read more</a>
</article>
